services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SENHA}"

    ports:
      - "1433:1433"

    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_SENHA}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
    
    volumes:
      - sql_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: src/Forms.API/Dockerfile

    ports:
      - "5000:8080"

    depends_on:
      sqlserver:
          condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "${ConnectionStrings__Default}"
      JWT_KEY: "${JWT_KEY}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_AUDIENCE: "${JWT_AUDIENCE}"

  web:
    build:
      context: .
      dockerfile: src/Forms.WEB/Dockerfile

    ports:
      - "3000:80"

    depends_on:
      - api

volumes:
  sql_data:
